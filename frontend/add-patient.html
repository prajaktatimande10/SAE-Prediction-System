<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        SAE <span>Predict</span>
    </div>

    <a href="dashboard.html" class="nav-item">
        Dashboard
    </a>

    <a href="patients.html" class="nav-item active">
        Patients
    </a>

    <a href="prediction.html" class="nav-item">
        SAE Prediction
    </a>

    <a href="analytics.html" class="nav-item">
        Analytics
    </a>

    <a href="reports.html" class="nav-item">
        Reports
    </a>

    <a href="settings.html" class="nav-item">
        Settings
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

    <div class="topbar">

        <div>
            <h1>Add New Patient</h1>

            <p>
                Enter patient clinical information
            </p>
        </div>

        <a href="patients.html" class="back-btn">
            ← Back to Patients
        </a>

    </div>


    <div id="message" class="message"></div>


    <div class="form-card">

        <form id="patientForm">


            <!-- ================= BASIC INFORMATION ================= -->

            <div class="section-title">
                Patient Information
            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Patient ID <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="patientId"
                        placeholder="PT-1001"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Patient Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="patientName"
                        placeholder="Enter patient name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Age <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        id="patientAge"
                        min="0"
                        max="120"
                        placeholder="45"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select id="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Sepsis Status</label>

                    <select id="sepsisStatus">

                        <option value="">
                            Select Status
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Consciousness</label>

                    <select id="consciousness">

                        <option value="">
                            Select
                        </option>

                        <option value="Alert">
                            Alert
                        </option>

                        <option value="Confused">
                            Confused
                        </option>

                        <option value="Drowsy">
                            Drowsy
                        </option>

                        <option value="Unresponsive">
                            Unresponsive
                        </option>

                    </select>

                </div>

            </div>

            <div class="section-title">
                Vital Signs
            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>

                    </label>

                        type="number"
                        id="gcs"

                    <label>
                        Heart Rate (bpm)
                    </label>

                    <input
                        type="number"
                        id="heartRate"

                    <label>
                        Blood Pressure
                    </label>

                    <input

                    >

                        Creatinine
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        id="creatinine"
                        placeholder="1.2"
                    >

                    <label>
                        Bilirubin
                    </label>

                        type="number"
                        step="0.1"

<!-- ================= JAVASCRIPT ================= -->

<script>

const API_URL = "http://127.0.0.1:5000";


document
.getElementById("patientForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const message =
        document.getElementById("message");


    // Collect patient data

    const patientData = {

        patient_id:
            document.getElementById("patientId").value.trim(),

        name:
            document.getElementById("patientName").value.trim(),

        age:
            Number(
                document.getElementById("patientAge").value
            ),

        gender:
            document.getElementById("gender").value,

        sepsis_status:
            document.getElementById("sepsisStatus").value,

        gcs:
            Number(
                document.getElementById("gcs").value || 0
            ),

        heart_rate:
            Number(
                document.getElementById("heartRate").value || 0
            ),

        blood_pressure:
            document.getElementById("bloodPressure").value,

        respiratory_rate:
            Number(
                document.getElementById("respiratoryRate").value || 0
            ),

        spo2:
            Number(
                document.getElementById("spo2").value || 0
            ),

        temperature:
            Number(
                document.getElementById("temperature").value || 0
            ),

        wbc:
            Number(
                document.getElementById("wbc").value || 0
            ),

        lactate:
            Number(
                document.getElementById("lactate").value || 0
            ),

        creatinine:
            Number(
                document.getElementById("creatinine").value || 0
            ),

        bilirubin:
            Number(
                document.getElementById("bilirubin").value || 0
            ),

        platelets:
            Number(
                document.getElementById("platelets").value || 0
            ),

        consciousness:
            document.getElementById("consciousness").value

    };


    // Send data to Flask

    try {

        const response = await fetch(
            `${API_URL}/api/patients`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(patientData)
            }
        );


        const result =
            await response.json();


        // Successful

        if (response.ok) {

            message.className =
                "message success";

            message.textContent =
                "Patient added successfully!";


            // Redirect after short delay

            setTimeout(function() {

                window.location.href =
                    "patients.html";

            }, 1000);

        }

        // Backend error

        else {

            message.className =
                "message error";

            message.textContent =
                result.message ||
                "Unable to add patient.";

        }


    } catch (error) {

        console.error(
            "Backend Error:",
            error
        );


        message.className =
            "message error";

        message.textContent =
            "Cannot connect to Flask backend. Make sure the backend is running.";

    }

});

</script>

</body>
</html>
