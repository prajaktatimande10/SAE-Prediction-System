<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patients | SAE Prediction System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #0f172a;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            padding: 10px 15px 30px;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav {
            list-style: none;
        }

        .nav li {
            margin: 7px 0;
        }

        .nav a {
            display: block;
            padding: 13px 15px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav a:hover,
        .nav a.active {
            background: #1e40af;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .subtitle {
            color: #64748b;
            margin-top: 5px;
        }

        /* BUTTON */

        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-view {
            background: #e0f2fe;
            color: #0369a1;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .search {
            width: 320px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            text-align: left;
            padding: 15px;
            font-size: 13px;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* RISK */

        .risk {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .risk-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .risk-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .risk-low {
            background: #dcfce7;
            color: #166534;
        }

        .risk-none {
            background: #e2e8f0;
            color: #475569;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        /* ERROR */

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        /* RESPONSIVE */

        @media(max-width: 900px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            SAE <span>Predict</span>
        </div>

        <ul class="nav">

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="patients.html" class="active">
                    Patients
                </a>
            </li>

            <li>
                <a href="prediction.html">
                    SAE Prediction
                </a>
            </li>

            <li>
                <a href="analytics.html">
                    Analytics
                </a>
            </li>

            <li>
                <a href="reports.html">
                    Reports
                </a>
            </li>

            <li>
                <a href="settings.html">
                    Settings
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>

                <h1>Patients</h1>

                <p class="subtitle">
                    Manage patient records and SAE risk information
                </p>

            </div>

            <a
                href="add-patient.html"
                class="btn btn-primary"
            >
                + Add Patient
            </a>

        </div>


        <div
            id="errorMessage"
            class="error"
        ></div>


        <div class="card">

            <div class="toolbar">

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="Search patient ID or name..."
                >

                <div id="patientCount">
                    Loading...
                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Patient ID</th>

                            <th>Name</th>

                            <th>Age</th>

                            <th>Gender</th>

                            <th>Sepsis</th>

                            <th>GCS</th>

                            <th>Risk</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="patientTableBody">

                        <tr>

                            <td
                                colspan="8"
                                class="loading"
                            >
                                Loading patients...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script>

        // Flask backend
        const API_URL = "http://127.0.0.1:5000";

        let allPatients = [];


        // =================================================
        // LOAD PATIENTS
        // =================================================

        async function loadPatients() {

            const tableBody =
                document.getElementById("patientTableBody");

            const errorMessage =
                document.getElementById("errorMessage");


            try {

                errorMessage.style.display = "none";


                const response = await fetch(
                    `${API_URL}/api/patients`
                );


                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }


                const data = await response.json();


                if (data.status !== "success") {

                    throw new Error(
                        data.message || "Unable to load patients"
                    );

                }


                allPatients = data.patients || [];


                displayPatients(allPatients);


            } catch (error) {

                console.error(
                    "Patient loading error:",
                    error
                );


                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >

                            Unable to connect to backend.

                            <br><br>

                            Make sure Flask is running on:

                            <br>

                            <strong>
                                http://127.0.0.1:5000
                            </strong>

                        </td>

                    </tr>

                `;


                errorMessage.innerHTML =
                    "Backend connection failed. Please start Flask using <b>python app.py</b>.";

                errorMessage.style.display = "block";

            }

        }


        // =================================================
        // DISPLAY PATIENTS
        // =================================================

        function displayPatients(patients) {

            const tableBody =
                document.getElementById(
                    "patientTableBody"
                );

            const patientCount =
                document.getElementById(
                    "patientCount"
                );


            patientCount.textContent =
                `${patients.length} patient${patients.length !== 1 ? "s" : ""}`;


            if (patients.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >

                            No patients found.

                            <br><br>

                            Click
                            <strong>+ Add Patient</strong>
                            to add your first patient.

                        </td>

                    </tr>

                `;

                return;

            }


            tableBody.innerHTML = "";


            patients.forEach(patient => {

                const row =
                    document.createElement("tr");


                let riskClass = "risk-none";

                if (patient.risk_level === "HIGH") {

                    riskClass = "risk-high";

                } else if (patient.risk_level === "MEDIUM") {

                    riskClass = "risk-medium";

                } else if (patient.risk_level === "LOW") {

                    riskClass = "risk-low";

                }


                const riskText =
                    patient.risk_level || "NOT PREDICTED";


                row.innerHTML = `

                    <td>
                        <strong>
                            ${patient.patient_id || "-"}
                        </strong>
                    </td>

                    <td>
                        ${patient.name || "-"}
                    </td>

                    <td>
                        ${patient.age || "-"}
                    </td>

                    <td>
                        ${patient.gender || "-"}
                    </td>

                    <td>
                        ${patient.sepsis_status || "-"}
                    </td>

                    <td>
                        ${patient.gcs || "-"}
                    </td>

                    <td>

                        <span class="risk ${riskClass}">
                            ${riskText}
                        </span>

                    </td>

                    <td>

                        <button
                            class="btn btn-view"
                            onclick="viewPatient(${patient.id})"
                        >
                            View
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="deletePatient(${patient.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;


                tableBody.appendChild(row);

            });

        }


        // =================================================
        // SEARCH
        // =================================================

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function () {

                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    const filtered =
                        allPatients.filter(patient => {

                            const id =
                                String(
                                    patient.patient_id || ""
                                ).toLowerCase();


                            const name =
                                String(
                                    patient.name || ""
                                ).toLowerCase();


                            return (
                                id.includes(search) ||
                                name.includes(search)
                            );

                        });


                    displayPatients(filtered);

                }
            );


        // =================================================
        // VIEW PATIENT
        // =================================================

        function viewPatient(id) {

            window.location.href =
                `prediction.html?patient_id=${id}`;

        }


        // =================================================
        // DELETE PATIENT
        // =================================================

        async function deletePatient(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this patient?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/patients/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (data.status === "success") {

                    alert(
                        "Patient deleted successfully."
                    );


                    loadPatients();

                } else {

                    alert(
                        data.message ||
                        "Unable to delete patient."
                    );

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Could not connect to Flask backend."
                );

            }

        }


        // =================================================
        // START
        // =================================================

        loadPatients();

    </script>


</body>

</html>
