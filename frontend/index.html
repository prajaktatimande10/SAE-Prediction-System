<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAE-Predict | ICU Early Warning System</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="brand-section">

            <div class="brand-icon">
                <i class="fa-solid fa-brain"></i>
            </div>

            <h1>SAE<span>-Predict</span></h1>

            <p>
                Sepsis-Associated Encephalopathy
                Early Warning System
            </p>

        </div>


        <div class="login-form">

            <h2>ICU Monitoring Portal</h2>

            <p class="login-subtitle">
                Sign in to access patient monitoring and
                SAE risk predictions.
            </p>

            <form onsubmit="login(event)">

                <div class="input-group-custom">

                    <label>Username</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required>
                    </div>

                </div>


                <div class="input-group-custom">

                    <label>Password</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required>

                    </div>

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>

                </div>


                <button class="login-btn" type="submit">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Sign In

                </button>

            </form>


            <div class="demo-info">

                <i class="fa-solid fa-circle-info"></i>

                Demo system for research and educational purposes.

            </div>

        </div>

    </div>


    <div class="login-footer">

        <span>
            <i class="fa-solid fa-shield-halved"></i>
            ICU Research Platform
        </span>

        <span>
            ML Powered Early Warning
        </span>

        <span>
            v1.0
        </span>

    </div>

</div>


<script>

function login(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (username && password) {

        window.location.href = "dashboard.html";

    }

}

</script>

</body>
</html>
